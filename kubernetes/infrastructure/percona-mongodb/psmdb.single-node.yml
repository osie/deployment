apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: mongodb
  namespace: osie
spec:
  crVersion: 1.22.0
  image: percona/percona-server-mongodb:7.0.18-11
  imagePullPolicy: IfNotPresent

  sharding:
    enabled: false

  replsets:
    - name: rs0
      size: 3
      affinity:
        antiAffinityTopologyKey: "none"
      resources:
        requests:
          cpu: "250m"
          memory: "512Mi"
        limits:
          cpu: "500m"
          memory: "1Gi"
      volumeSpec:
        persistentVolumeClaim:
          # storageClassName: local-path
          resources:
            requests:
              storage: 10Gi
      expose:
        enabled: true
        type: ClusterIP
