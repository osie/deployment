include:
  - docker-compose.base.yml

services:
  caddy:
    image: caddy:alpine
    container_name: osie-caddy
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - osie-network
    depends_on:
      - osie-ui
      - osie-admin
      - osie-api

volumes:
  caddy_data:
  caddy_config:
